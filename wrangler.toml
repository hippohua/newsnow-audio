name = "newsnow-audio"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 定时任务（UTC 时间，北京时间 = UTC+8）
# 23:00 UTC = 明早 07:00 通勤早高峰前
# 09:30 UTC = 17:30 晚高峰前
[triggers]
crons = ["0 23 * * *", "30 9 * * *"]

# 音频存储（7 天生命周期在 R2 控制台或部署脚本中配置）
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "newsnow-audio"

# 播报队列存储（feed 数据 + 用户偏好）
[[kv_namespaces]]
binding = "FEED"
id = "TODO_REPLACE_WITH_KV_ID"

[vars]
# newsnow 部署地址（改成你的 workers.dev 域名）
NEWSNOW_BASE = "https://your-newsnow.workers.dev"
# LLM（OpenAI 兼容接口）：DeepSeek 或 GLM
LLM_BASE_URL = "https://api.deepseek.com"
LLM_MODEL = "deepseek-chat"
# TTS：dashscope(qwen-tts) / 有趣音色可换 cosyvoice
TTS_PROVIDER = "dashscope"
TTS_VOICE = "Cherry"
# 语速播报口径：标题模式
TTS_SPEED_TITLE = "1.15"

# 密钥不要写在这里，用 wrangler secret put 配置：
#   wrangler secret put LLM_API_KEY      # DeepSeek/GLM 的 API Key
#   wrangler secret put TTS_API_KEY      # 阿里云 DashScope API Key
#   wrangler secret put RUN_TOKEN        # 手动触发 /run 的口令
